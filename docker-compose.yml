version: "3.8"

services:
  # TODO: Remove NGINX service in production
  nginx:
    image: nginx:1.19
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "80:8080"
    volumes:
      - /home/ubuntu/press_demo/resources/nginx-entrypoint.sh:/usr/local/bin/nginx-entrypoint.sh
      - /home/ubuntu/press_demo/resources/nginx.template:/templates/nginx/frappe.conf.template
      - ./mounts/sites:/etc/nginx/sites
      - ./mounts/assets:/etc/nginx/sites/assets
    depends_on:
      - frontend

  backend:
    image: press_demo:latest
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - ./mounts/sites:/home/frappe/frappe-bench/sites
      - ./mounts/logs:/home/frappe/frappe-bench/logs

  frontend:
    image: press_demo:latest
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - "80:8080"
    volumes:
      - ./mounts/logs:/home/frappe/frappe-bench/logs
      - ./mounts/sites:/home/frappe/frappe-bench/sites
      - ./mounts/assets:/home/frappe/frappe-bench/sites/assets
    depends_on:
      - websocket
      - redis-cache
      - redis-queue
      - redis-socketio

  db:
    image: mariadb:10.6
    healthcheck:
      test: mysqladmin ping -h localhost --password=admin
      interval: 1s
      retries: 15
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - ./mounts/db-data:/var/lib/mysql

  configurator:
    image: press_demo:latest
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host ${DB_HOST};
        bench set-config -gp db_port ${DB_PORT};
        bench set-config -g redis_cache "redis://${REDIS_CACHE}";
        bench set-config -g redis_queue "redis://${REDIS_QUEUE}";
        bench set-config -g redis_socketio "redis://${REDIS_QUEUE}";
        bench set-config -gp socketio_port ${SOCKETIO_PORT};
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - ./mounts/sites:/home/frappe/frappe-bench/sites
      - ./mounts/logs:/home/frappe/frappe-bench/logs

  create-site:
    image: press_demo:latest
    deploy:
      restart_policy:
        condition: none
    volumes:
      - ./mounts/sites:/home/frappe/frappe-bench/sites
      - ./mounts/logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        cd sites;
        export start=$(date +%s);
        until [[ -n $(grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty") ]] && 
              [[ -n $(grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty") ]] && 
              [[ -n $(grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty") ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( $(date +%s)-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1;
          fi;
        done;
        echo "sites/common_site_config.json found";
        bench new-site --no-mariadb-socket --admin-password=admin --db-root-password=admin  --set-default frontend;
#bench new-site --no-mariadb-socket --admin-password=admin --db-root-password=admin --install-app erpnext --set-default frontend;

  websocket:
    image: press_demo:latest
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    working_dir: /home/frappe/frappe-bench
    volumes:
      - logs:/home/frappe/frappe-bench/logs
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - redis-socketio

  worker_default:
    image: press_demo:latest
    command: ["bench", "worker", "--queue", "default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - redis-cache
      - redis-queue
      - redis-socketio

  queue-long:
    image: press_demo:latest
    command: ["bench", "worker", "--queue", "long"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - redis-cache
      - redis-queue
      - redis-socketio

  queue-short:
    image: press_demo:latest
    command: ["bench", "worker", "--queue", "short"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - redis-cache
      - redis-queue
      - redis-socketio

  redis-cache:
    image: redis:6.0

  redis-queue:
    image: redis:6.0

  redis-socketio:
    image: redis:6.0

volumes:
  nginx:
  logs:
  sites:
  assets:
  mysql:


